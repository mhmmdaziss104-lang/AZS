<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stunning Flowers For You</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1b0c36, #070310 80%, #000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            font-family: 'Dancing Script', cursive;
            color: #fff;
            perspective: 1000px;
        }

        /* Particle Stars */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(1px 1px at 10% 20%, #fff, transparent),
                radial-gradient(1px 1px at 30% 50%, #fff, transparent),
                radial-gradient(2px 2px at 80% 40%, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(2px 2px at 60% 80%, rgba(255, 255, 255, 0.8), transparent);
            background-size: 200px 200px;
            animation: starsDrift 30s linear infinite;
            opacity: 0.6;
            z-index: 0;
        }

        @keyframes starsDrift {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-200px);
            }
        }

        /* Animated Glowing Fireflies */
        .firefly {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #d884f2, 0 0 20px #8b22a8;
            opacity: 0.8;
            z-index: 10;
        }

        /* Text Content */
        .text-container {
            position: absolute;
            top: 15%;
            text-align: center;
            width: 100%;
            z-index: 50;
            text-shadow: 0 0 15px #d884f2, 0 0 30px #aa33cc, 0 0 45px #4f1066;
            pointer-events: none;
        }

        h1 {
            font-size: 5rem;
            opacity: 0;
            transform: translateY(30px);
            transition: all 2s ease 0.5s;
            letter-spacing: 2px;
        }

        p {
            font-size: 2rem;
            color: #f0a3ff;
            opacity: 0;
            transition: all 2s ease 1.5s;
        }

        /* Full Bouquet Container */
        .bouquet {
            position: relative;
            width: 100%;
            height: 65vh;
            display: flex;
            justify-content: center;
            opacity: 0;
            transition: opacity 2s ease, transform 0.5s ease-out;
            transform: translateY(50px);
            z-index: 5;
        }

        /* Individual Flower Positioning */
        .flower-wrapper {
            position: absolute;
            bottom: -5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
        }

        /* Ultra-realistic CSS Stems */
        .stem {
            width: 1.5vmin;
            height: 45vmin;
            background: linear-gradient(to right, #0a260f, #227a29, #0a260f);
            border-radius: 20px;
            box-shadow: inset 2px 0 5px rgba(0, 0, 0, 0.8), 0 0 15px rgba(34, 122, 41, 0.6);
            position: relative;
        }

        /* Detailed Leaves */
        .leaf {
            position: absolute;
            width: 9vmin;
            height: 18vmin;
            background: linear-gradient(to top right, #0e3012, #36a337, #13521a);
            border-radius: 0 80% 0 80%;
            transform-origin: bottom left;
            bottom: 12vmin;
            left: 0.5vmin;
            box-shadow: inset 2px 2px 6px rgba(255, 255, 255, 0.2), inset -2px -2px 10px rgba(0, 0, 0, 0.6);
            animation: sway 4s ease-in-out infinite alternate;
        }

        .leaf::after {
            content: "";
            position: absolute;
            width: 1.5px;
            height: 100%;
            background: #0e3012;
            left: 50%;
            transform: rotate(-10deg);
        }

        .leaf.right {
            border-radius: 80% 0 80% 0;
            transform-origin: bottom right;
            bottom: 22vmin;
            left: auto;
            right: 0.5vmin;
        }

        /* The Bloom / Petals - More 3D layered approach */
        .bloom {
            position: absolute;
            bottom: 42vmin;
            width: 14vmin;
            height: 19vmin;
            z-index: 10;
        }

        .petal {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, #300840, #961cb8, #ffb3ff);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            box-shadow: inset 0 -15px 25px rgba(0, 0, 0, 0.7), 0 0 25px rgba(216, 132, 242, 0.4);
            transform-origin: bottom center;
            opacity: 0;
            transition: all 2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Glowing center / bulb */
        .bulb {
            position: absolute;
            width: 6vmin;
            height: 8vmin;
            background: #fff;
            border-radius: 50%;
            bottom: 2vmin;
            left: 4vmin;
            box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.9), 0 0 60px 25px #e784f2;
            z-index: 0;
            opacity: 0;
            transition: opacity 3s ease 1s;
        }

        .petal-left-back {
            transform: rotate(-35deg) scale(0.85);
            left: -5vmin;
            z-index: 1;
            background: linear-gradient(to top, #1c0326, #5c0f73, #d98ee6);
        }

        .petal-right-back {
            transform: rotate(35deg) scale(0.85);
            left: 5vmin;
            z-index: 1;
            background: linear-gradient(to top, #1c0326, #5c0f73, #d98ee6);
        }

        .petal-left {
            transform: rotate(-18deg);
            left: -3vmin;
            z-index: 3;
        }

        .petal-right {
            transform: rotate(18deg);
            left: 3vmin;
            z-index: 3;
        }

        .petal-center {
            transform: rotate(0deg);
            z-index: 4;
            box-shadow: inset 0 -15px 20px rgba(0, 0, 0, 0.5), inset 0 10px 25px rgba(255, 255, 255, 0.5), 0 0 25px rgba(216, 132, 242, 0.8);
        }

        /* Positioning the bouquet array */
        #f1 {
            transform: rotate(-28deg) translate(-15vmin, 8vmin);
        }

        #f2 {
            transform: rotate(-14deg) translate(-7vmin, 0vmin);
            z-index: 10;
        }

        #f3 {
            transform: rotate(0deg) translate(0, -6vmin);
            z-index: 12;
        }

        #f4 {
            transform: rotate(14deg) translate(7vmin, 0vmin);
            z-index: 10;
        }

        #f5 {
            transform: rotate(28deg) translate(15vmin, 8vmin);
        }

        /* Scale adjustments for depth perspective */
        #f1,
        #f5 {
            scale: 0.75;
            filter: brightness(0.6) blur(1.5px);
        }

        #f2,
        #f4 {
            scale: 0.9;
            filter: brightness(0.8);
        }

        #f3 {
            scale: 1.15;
            filter: drop-shadow(0 0 20px rgba(216, 132, 242, 0.4));
        }

        @keyframes sway {
            0% {
                transform: rotate(-3deg);
            }

            100% {
                transform: rotate(3deg);
            }
        }

        /* Initial State before Bloom */
        .flower-wrapper .bloom {
            transform: scale(0.3) translateY(20vmin);
        }

        .flower-wrapper .stem {
            height: 0;
            transition: height 2s ease-out;
        }

        .flower-wrapper .leaf {
            transform: scale(0);
            transition: transform 1.5s ease-out 1s;
        }

        /* Activating animation */
        body.blooming h1,
        body.blooming p {
            opacity: 1;
            transform: translateY(0);
        }

        body.blooming .bouquet {
            opacity: 1;
            transform: translateY(0);
        }

        body.blooming .bloom {
            transform: scale(1) translateY(0);
            transition: transform 2.5s cubic-bezier(0.1, 0.8, 0.2, 1) 1.5s;
        }

        body.blooming .petal {
            opacity: 1;
        }

        body.blooming .stem {
            height: 45vmin;
        }

        body.blooming .leaf {
            transform: scale(1);
        }

        body.blooming .bulb {
            opacity: 1;
            animation: pulse 3s infinite alternate;
        }

        /* Cascading Delays */
        body.blooming #f3 .bloom {
            transition-delay: 1.5s;
        }

        body.blooming #f2 .bloom,
        body.blooming #f4 .bloom {
            transition-delay: 2s;
        }

        body.blooming #f1 .bloom,
        body.blooming #f5 .bloom {
            transition-delay: 2.5s;
        }

        body.blooming #f3 .stem {
            transition-delay: 0s;
        }

        body.blooming #f2 .stem,
        body.blooming #f4 .stem {
            transition-delay: 0.5s;
        }

        body.blooming #f1 .stem,
        body.blooming #f5 .stem {
            transition-delay: 1s;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.4), 0 0 50px 15px rgba(231, 132, 242, 0.5);
            }

            100% {
                box-shadow: 0 0 40px 15px rgba(255, 255, 255, 0.8), 0 0 80px 30px rgba(231, 132, 242, 0.9);
            }
        }

        /* Overlay to click */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            transition: opacity 1.5s ease;
            cursor: pointer;
        }

        .overlay span {
            font-size: 2.5rem;
            color: #fff;
            padding: 20px 40px;
            border: 2px solid #d884f2;
            border-radius: 40px;
            background: rgba(216, 132, 242, 0.1);
            box-shadow: 0 0 30px rgba(216, 132, 242, 0.6), inset 0 0 15px rgba(216, 132, 242, 0.6);
            animation: beat 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
            transition: all 0.3s;
        }

        .overlay span:hover {
            background: rgba(216, 132, 242, 0.3);
            box-shadow: 0 0 50px #d884f2;
            transform: scale(1.05);
        }

        @keyframes beat {

            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(216, 132, 242, 0.4);
            }

            50% {
                transform: scale(1.05);
                box-shadow: 0 0 40px rgba(216, 132, 242, 0.8), inset 0 0 20px rgba(216, 132, 242, 0.8);
            }
        }

        /* Firefly animations created via JS */
        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="stars"></div>
    <div class="overlay" id="overlay">
        <span>Buka Bunga 🌸</span>
    </div>

    <div id="fireflies"></div>

    <div class="text-container">
        <h1>A Million Flowers</h1>
        <p>Hanya untukmu</p>
    </div>

    <div class="bouquet" id="bouquet">
        <!-- Generated by JS to keep HTML clean -->
    </div>

    <script>
        // Membangun Bouquet
        const bouquet = document.getElementById('bouquet');
        const ids = ['f1', 'f2', 'f3', 'f4', 'f5'];
        let html = '';

        ids.forEach(id => {
            html += `
            <div class="flower-wrapper" id="${id}">
                <div class="bloom">
                    <div class="bulb"></div>
                    <div class="petal petal-left-back"></div>
                    <div class="petal petal-right-back"></div>
                    <div class="petal petal-left"></div>
                    <div class="petal petal-right"></div>
                    <div class="petal petal-center"></div>
                </div>
                ${id !== 'f3' ? '<div class="leaf"></div>' : ''}
                ${id === 'f3' || id === 'f4' ? '<div class="leaf right"></div>' : ''}
                <div class="stem"></div>
            </div>`;
        });
        bouquet.innerHTML = html;

        // Membangun Fireflies (Partikel terbang)
        const ffContainer = document.getElementById('fireflies');
        for (let i = 0; i < 40; i++) {
            const ff = document.createElement('div');
            ff.className = 'firefly';
            ff.style.left = Math.random() * 100 + 'vw';
            ff.style.bottom = '-10px';
            const duration = Math.random() * 8 + 6;
            const delay = Math.random() * 10;
            ff.style.animation = `floatUp ${duration}s ${delay}s infinite ease-in`;
            ffContainer.appendChild(ff);
        }

        // Interaksi Tombol
        document.getElementById('overlay').addEventListener('click', function () {
            this.style.opacity = '0';
            setTimeout(() => {
                this.style.display = 'none';
                // Trigger animasi mekar
                document.body.classList.add('blooming');
            }, 1000); // Tunggu overlay hilang
        });

        // Interaksi Parallax berdasarkan Mouse
        document.addEventListener('mousemove', (e) => {
            if (!document.body.classList.contains('blooming')) return;
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            document.getElementById('bouquet').style.transform = `translateX(${x}px) translateY(${y}px)`;
            document.querySelector('.text-container').style.transform = `translateX(${x * 1.5}px) translateY(${y * 1.5}px)`;
        });
    </script>
</body>

</html>
