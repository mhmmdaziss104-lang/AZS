<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers For You</title>
    <!-- CSS and the rest from previous chunk exactly the same -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            background-color: #0c081a;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, 0.8), rgba(0, 0, 0, 0)),
                radial-gradient(3px 3px at 50px 160px, #ffffff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 90px 40px, rgba(255, 255, 255, 0.7), rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 150px 100px, #ffffff, rgba(0, 0, 0, 0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.7;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 0.7;
            }
        }

        .title {
            position: absolute;
            top: 15%;
            font-size: 4rem;
            color: #d884f2;
            text-shadow: 0 0 10px rgba(216, 132, 242, 0.8), 0 0 20px rgba(216, 132, 242, 0.4);
            font-style: italic;
            opacity: 0;
            animation: fadeIn 3s 1s forwards;
            z-index: 10;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .flower-bouquet {
            position: relative;
            width: 100%;
            height: 70vh;
            display: flex;
            justify-content: center;
        }

        .flower {
            position: absolute;
            bottom: 5vh;
            transform-origin: bottom center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stem {
            width: 1.5vmin;
            height: 35vmin;
            background: linear-gradient(to right, #1a4a15, #368a25, #1a4a15);
            border-radius: 4px;
            position: relative;
            z-index: 1;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .leaf {
            position: absolute;
            width: 10vmin;
            height: 12vmin;
            background: linear-gradient(to top right, #1a4a15, #4a8b24);
            border-radius: 0 50% 0 50%;
            bottom: 5vmin;
            left: -5vmin;
            transform-origin: bottom right;
            animation: leafWind 4s ease-in-out infinite alternate;
            z-index: 2;
        }

        .leaf.right {
            left: 2vmin;
            bottom: 12vmin;
            border-radius: 50% 0 50% 0;
            transform-origin: bottom left;
            background: linear-gradient(to top left, #1a4a15, #56a62c);
        }

        @keyframes leafWind {
            0% {
                transform: rotate(-5deg);
            }

            100% {
                transform: rotate(5deg);
            }
        }

        .bloom {
            width: 14vmin;
            height: 18vmin;
            position: absolute;
            bottom: 34vmin;
            z-index: 3;
            opacity: 0;
            transform: scale(0);
            animation: bloomAnim 2s ease-out forwards;
        }

        .petal {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f9a8ff, #8b22a8, #300840);
            border-radius: 50% 50% 30% 30%;
            box-shadow: inset 0 -10px 20px rgba(0, 0, 0, 0.4);
            transform-origin: bottom center;
        }

        .petal.center {
            z-index: 3;
            width: 12vmin;
            height: 17vmin;
            bottom: 0;
            left: 1vmin;
            background: linear-gradient(to bottom, #d884f2, #aa33cc, #4f1066);
        }

        .petal.left {
            transform: rotate(-25deg);
            z-index: 2;
            left: -3vmin;
            bottom: -2vmin;
        }

        .petal.right {
            transform: rotate(25deg);
            z-index: 2;
            right: -3vmin;
            bottom: -2vmin;
        }

        @keyframes bloomAnim {
            0% {
                opacity: 0;
                transform: scale(0) translateY(10vmin);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .flower:nth-child(1) {
            transform: rotate(-20deg) translateX(-15vmin);
        }

        .flower:nth-child(2) {
            transform: rotate(0deg) translateY(2vmin);
            z-index: 5;
        }

        .flower:nth-child(3) {
            transform: rotate(20deg) translateX(15vmin);
        }

        .flower:nth-child(1) .bloom {
            animation-delay: 0.2s;
        }

        .flower:nth-child(2) .bloom {
            animation-delay: 0.6s;
        }

        .flower:nth-child(3) .bloom {
            animation-delay: 1.0s;
        }

        .click-text {
            position: absolute;
            bottom: 50%;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.5rem;
            text-align: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.5s;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.5);
        }

        .click-text:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px #d884f2;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="stars"></div>

    <div class="click-text" id="start-btn">Sentuh untuk Membuatnya Mekar 🌸</div>

    <div class="flower-bouquet" id="bouquet" style="display: none;">
        <h1 class="title">Flowers For You</h1>

        <div class="flower">
            <div class="bloom">
                <div class="petal left"></div>
                <div class="petal right"></div>
                <div class="petal center"></div>
            </div>
            <div class="leaf"></div>
            <div class="stem"></div>
        </div>

        <div class="flower">
            <div class="bloom">
                <div class="petal left"></div>
                <div class="petal right"></div>
                <div class="petal center"></div>
            </div>
            <div class="leaf right"></div>
            <div class="leaf"></div>
            <div class="stem"></div>
        </div>

        <div class="flower">
            <div class="bloom">
                <div class="petal left"></div>
                <div class="petal right"></div>
                <div class="petal center"></div>
            </div>
            <div class="leaf right"></div>
            <div class="stem"></div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('start-btn');
        btn.addEventListener('click', function () {
            this.style.opacity = '0';
            setTimeout(() => {
                this.style.display = 'none';
                document.getElementById('bouquet').style.display = 'flex';
            }, 500);
        });
    </script>
</body>

</html>
