<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowers For You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0b0c10;
            color: #d884f2;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            flex-direction: column;
        }

        h1 {
            position: absolute;
            top: 10%;
            font-style: italic;
            text-shadow: 0 0 10px #d884f2;
        }

        .flower-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        /* Sesuai dengan kode di screenshot */
        .flower {
            position: absolute;
            left: 50%;
            bottom: 2vmin;
            transform: translateX(-50%);
            width: 5vmin;
            height: 14vmin;
            background-image: linear-gradient(to bottom, #38f2ff, #16a1f8, #1a2a3a 99%);
            clip-path: ellipse(50% 50% at 50% 50%);
            transform-origin: center bottom;
            animation: open-flower 2s 1s backwards;
        }

        @keyframes open-flower {
            0% {
                transform: translateX(-50%) scaleY(0);
            }
            100% {
                transform: translateX(-50%) scaleY(1);
            }
        }
        
        /* Tambahan untuk melengkapi bunga */
        .stem {
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 1.5vmin;
            height: 30vmin;
            transform: translateX(-50%);
            background: linear-gradient(to left, #2c5814, #4a8b24);
            border-radius: 5vmin;
        }

        .tulip {
            position: absolute;
            left: 50%;
            bottom: 30vmin;
            transform: translateX(-50%);
            width: 12vmin;
            height: 16vmin;
            background: linear-gradient(to bottom, #d884f2, #8b22a8, #300840);
            border-radius: 40% 40% 50% 50%;
            box-shadow: 0 0 20px #8b22a8;
        }

        .tulip::before, .tulip::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #f0a3ff, #aa33cc);
            border-radius: 40% 40% 50% 50%;
            transform-origin: bottom center;
        }

        .tulip::before {
            transform: rotate(-15deg);
            left: -2vmin;
        }

        .tulip::after {
            transform: rotate(15deg);
            right: -2vmin;
        }
    </style>
</head>
<body>
    <h1>Flowers For You</h1>
    <div class="flower-container">
        <!-- Tangkai dan bunga tulip ungu -->
        <div class="stem"></div>
        <div class="tulip"></div>
        
        <!-- Daun dengan kode dari screenshot -->
        <div class="flower" style="left: 48%; transform: translateX(-50%) rotate(-30deg); bottom: 10vmin; background-image: linear-gradient(to bottom, #4a8b24, #2c5814, #1a2a3a 99%);"></div>
        <div class="flower" style="left: 52%; transform: translateX(-50%) rotate(30deg); bottom: 15vmin; background-image: linear-gradient(to bottom, #4a8b24, #2c5814, #1a2a3a 99%);"></div>
    </div>
</body>
</html>
